# FILE_NAME: issue-provision.yml
# DESCRIPTION: IssueOps — validate form, render stack, open workload PR, track Deployment.
# VERSION: 0.7.0

name: issue-provision

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write
  deployments: write

env:
  PYTHONPATH: src

# opened+labeled (or double delivery) can race the same natural-key branch.
concurrency:
  group: issue-provision-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  provision:
    # Labels are NOT auto-applied by the public Issue Form (see ISSUE_TEMPLATE).
    # Product is chosen in the form body; operators only need to add issueops.
    if: contains(github.event.issue.labels.*.name, 'issueops')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authorize requester
        id: authz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.issue.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -m gh_platform_control authorize \
            --root . \
            --actor "${ACTOR}" \
            --repository "${REPOSITORY}" \
            --mode operators_or_write

      - name: Validate control config
        id: cfg
        run: |
          set -euo pipefail
          ALLOW_PIN_PLACEHOLDERS=1 python3 -m gh_platform_control validate-pins
          ALLOW_PLACEHOLDERS=1 python3 -m gh_platform_control validate-control

      - name: Parse issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "${ISSUE_BODY}" > /tmp/issue-body.md
          python3 -m gh_platform_control parse-issue --body-file /tmp/issue-body.md --out /tmp/request.json
          product="$(python3 -c 'import json; print(json.load(open("/tmp/request.json")).get("product","").strip())')"
          if [[ -z "${product}" ]]; then
            echo "::error::missing Product field in issue form body"
            exit 1
          fi
          if [[ ! "${product}" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "::error::invalid Product id (expected lowercase alnum/hyphen)"
            exit 1
          fi
          echo "id=${product}" >> "${GITHUB_OUTPUT}"

      - name: Sync product label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRODUCT: ${{ steps.parse.outputs.id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Keep product:* labels for filters/status; form field is source of truth.
          # PRODUCT already validated as safe slug in parse step.
          existing="$(gh issue view "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --json labels --jq '.labels[].name' | grep '^product:' || true)"
          for lbl in ${existing}; do
            if [[ "${lbl}" != "product:${PRODUCT}" ]]; then
              gh issue edit "${ISSUE_NUMBER}" --repo "${REPOSITORY}" --remove-label "${lbl}" || true
            fi
          done
          gh issue edit "${ISSUE_NUMBER}" \
            --repo "${REPOSITORY}" \
            --add-label "product:${PRODUCT}" || true

      - name: Validate request
        id: validate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CONTROL_REPO: ${{ github.repository }}
          PRODUCT: ${{ steps.parse.outputs.id }}
        run: |
          set -euo pipefail
          python3 -m gh_platform_control validate-request \
            --request-json /tmp/request.json \
            --product "${PRODUCT}" \
            --root . \
            --issue-number "${ISSUE_NUMBER}" \
            --control-repo "${CONTROL_REPO}" \
            --out /tmp/resolved.json
          echo "stack_id=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["stack_id"])')" >> "${GITHUB_OUTPUT}"
          echo "workload=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["workload_repository"])')" >> "${GITHUB_OUTPUT}"
          echo "workload_repo=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["workload_repository"].split("/",1)[1])')" >> "${GITHUB_OUTPUT}"
          echo "environment=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["environment"])')" >> "${GITHUB_OUTPUT}"
          echo "runner=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json")).get("runner","tofu"))')" >> "${GITHUB_OUTPUT}"

      - name: Render stack
        id: render
        run: |
          set -euo pipefail
          python3 -m gh_platform_control render-stack \
            --resolved-json /tmp/resolved.json \
            --root . \
            --out-dir /tmp/stack-out

      - name: Require App credentials on control
        id: require-creds
        env:
          CLIENT_ID: ${{ vars.CONTROL_CLIENT_ID }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CONTROL_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLIENT_ID}" ]]; then
            echo "::error::CONTROL_CLIENT_ID repository variable is missing on this control repo (not the workload repo)."
            exit 1
          fi
          if [[ "${PRIVATE_KEY_PRESENT}" != "true" ]]; then
            echo "::error::CONTROL_APP_PRIVATE_KEY repository secret is missing on this control repo (not the workload repo)."
            exit 1
          fi
          echo "OK: App credentials present on control"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONTROL_CLIENT_ID }}
          private-key: ${{ secrets.CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.validate.outputs.workload_repo }}
          # Token inherits App installation permissions. The App MUST grant
          # Contents + Pull requests (RW) on workload repos or PR create fails.

      - name: Reject duplicate resource
        id: duplicate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CONTROL_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 -m gh_platform_control check-duplicate \
            --resolved-json /tmp/resolved.json \
            --out-dir . \
            --attach

      - name: Open workload PR
        id: pr
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 -m gh_platform_control open-workload-pr \
            --resolved-json /tmp/resolved.json \
            --stack-src /tmp/stack-out \
            --token "${APP_TOKEN}"
          echo "url=$(cat .pr-url)" >> "${GITHUB_OUTPUT}"
          echo "mode=$(cat .pr-mode 2>/dev/null || echo created)" >> "${GITHUB_OUTPUT}"

      # Tracking-only Deployment on control (NOT an AWS deploy gate).
      # Real Environment protection + OIDC live on workload repos (infra-<env>).
      - name: Create tracking Deployment
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ steps.validate.outputs.environment }}
          STACK_ID: ${{ steps.validate.outputs.stack_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # Namespaced so control UI does not look like "Ready to deploy to dev".
          tracking_env="issueops-${ENVIRONMENT}"
          payload="$(python3 -c 'import json,os; print(json.dumps({"stack_id":os.environ["STACK_ID"],"pr":os.environ["PR_URL"],"issue":int(os.environ["ISSUE_NUMBER"]),"tracking":True}))')"
          resp="$(gh api --method POST "/repos/${{ github.repository }}/deployments" --input - <<EOF
          {
            "ref": "${{ github.sha }}",
            "environment": "${tracking_env}",
            "description": "IssueOps tracking ${STACK_ID} (not an AWS deploy)",
            "auto_merge": false,
            "required_contexts": [],
            "production_environment": false,
            "transient_environment": true,
            "payload": ${payload}
          }
          EOF
          )"
          dep_id="$(printf '%s' "${resp}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "id=${dep_id}" >> "${GITHUB_OUTPUT}"
          echo "tracking_env=${tracking_env}" >> "${GITHUB_OUTPUT}"
          status_args=(
            --method POST
            "/repos/${{ github.repository }}/deployments/${dep_id}/statuses"
            -f state="pending"
            -f description="Workload PR opened — apply happens on infra-${ENVIRONMENT}"
            -f environment="${tracking_env}"
          )
          if [[ "${PR_URL}" == https://* ]]; then
            status_args+=(-f environment_url="${PR_URL}" -f log_url="${PR_URL}")
          fi
          gh api "${status_args[@]}"

      - name: Update issue
        id: update-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          STACK_ID: ${{ steps.validate.outputs.stack_id }}
          WORKLOAD: ${{ steps.validate.outputs.workload }}
          DEP_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "status:pending-validation" \
            --remove-label "status:validation-failed" \
            --remove-label "status:config-error" \
            --remove-label "status:provision-failed" \
            --add-label "status:pr-open"
          mode="${{ steps.pr.outputs.mode }}"
          title="IssueOps accepted"
          if [[ "${mode}" == "attached" ]]; then
            title="IssueOps attached (same-issue reuse)"
          fi
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ### ${title}

          | Field | Value |
          | --- | --- |
          | Stack | \`${STACK_ID}\` |
          | Workload | \`${WORKLOAD}\` |
          | Pull request | ${PR_URL} |
          | Mode | \`${mode}\` |
          | Deployment id | \`${DEP_ID}\` |

          Next: review the PR; workload CI runs \`tofu-pipeline\` plan (OpenTofu or Terragrunt auto-detect). Merge + Environment approval applies.
          EOF
          )"

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHZ: ${{ steps.authz.outcome }}
          CFG: ${{ steps.cfg.outcome }}
          PARSE: ${{ steps.parse.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          RENDER: ${{ steps.render.outcome }}
          CREDS: ${{ steps.require-creds.outcome }}
          APP: ${{ steps.app-token.outcome }}
          DUP: ${{ steps.duplicate.outcome }}
          PR: ${{ steps.pr.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          label="status:provision-failed"
          reason="provision"
          if [[ "${AUTHZ}" == "failure" ]]; then
            label="status:validation-failed"
            reason="authorization (issue author not an operator)"
          elif [[ "${CFG}" == "failure" || "${CREDS}" == "failure" || "${APP}" == "failure" ]]; then
            label="status:config-error"
            reason="config (pins/App credentials/token)"
          elif [[ "${PARSE}" == "failure" || "${VALIDATE}" == "failure" || "${RENDER}" == "failure" || "${DUP}" == "failure" ]]; then
            label="status:validation-failed"
            reason="validation (form/catalog/render/duplicate)"
          elif [[ "${PR}" == "failure" || "${DEPLOY}" == "failure" ]]; then
            label="status:provision-failed"
            reason="provision (PR/deployment)"
          fi

          gh issue edit "${ISSUE_NUMBER}" \
            --repo "${REPOSITORY}" \
            --remove-label "status:pending-validation" \
            --remove-label "status:validation-failed" \
            --remove-label "status:config-error" \
            --remove-label "status:provision-failed" \
            --add-label "${label}" || true

          # Duplicate step already posted fail+attach comments.
          if [[ "${DUP}" == "failure" && -f .duplicate-conflicts.md ]]; then
            exit 0
          fi

          gh issue comment "${ISSUE_NUMBER}" \
            --repo "${REPOSITORY}" \
            --body "$(cat <<EOF
          ### IssueOps failed (\`${reason}\`)

          Label: \`${label}\`
          Workflow: ${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}
          EOF
          )" || true
