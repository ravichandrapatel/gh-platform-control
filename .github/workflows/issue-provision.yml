# FILE_NAME: issue-provision.yml
# DESCRIPTION: IssueOps — validate form, render stack, open workload PR, track Deployment.
# VERSION: 0.2.0

name: issue-provision

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write
  deployments: write

jobs:
  provision:
    if: >-
      contains(github.event.issue.labels.*.name, 'issueops') &&
      contains(github.event.issue.labels.*.name, 'product:s3-bucket')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate control config
        id: cfg
        run: |
          set -euo pipefail
          ALLOW_PIN_PLACEHOLDERS=1 ./scripts/validate-pins.sh
          ALLOW_PLACEHOLDERS=1 ./scripts/validate-control.sh

      - name: Parse issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          printf '%s\n' "${ISSUE_BODY}" > /tmp/issue-body.md
          python3 scripts/parse_issue.py --body-file /tmp/issue-body.md --out /tmp/request.json

      - name: Validate request
        id: validate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CONTROL_REPO: ${{ github.repository }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/validate_request.py \
            --request-json /tmp/request.json \
            --product s3-bucket \
            --root . \
            --issue-number "${ISSUE_NUMBER}" \
            --control-repo "${CONTROL_REPO}" \
            --out /tmp/resolved.json
          echo "stack_id=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["stack_id"])')" >> "${GITHUB_OUTPUT}"
          echo "workload=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["workload_repository"])')" >> "${GITHUB_OUTPUT}"
          echo "workload_repo=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["workload_repository"].split("/",1)[1])')" >> "${GITHUB_OUTPUT}"
          echo "environment=$(python3 -c 'import json; print(json.load(open("/tmp/resolved.json"))["environment"])')" >> "${GITHUB_OUTPUT}"

      - name: Render stack
        id: render
        env:
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/render_stack.py \
            --resolved-json /tmp/resolved.json \
            --root . \
            --out-dir /tmp/stack-out

      - name: Require App credentials on control
        id: require-creds
        env:
          CLIENT_ID: ${{ vars.CONTROL_CLIENT_ID }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CONTROL_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLIENT_ID}" ]]; then
            echo "::error::CONTROL_CLIENT_ID repository variable is missing on this control repo (not the workload repo)."
            exit 1
          fi
          if [[ "${PRIVATE_KEY_PRESENT}" != "true" ]]; then
            echo "::error::CONTROL_APP_PRIVATE_KEY repository secret is missing on this control repo (not the workload repo)."
            exit 1
          fi
          echo "OK: App credentials present on control"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONTROL_CLIENT_ID }}
          private-key: ${{ secrets.CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.validate.outputs.workload_repo }}
          # Token inherits App installation permissions. The App MUST grant
          # Contents + Pull requests (RW) on workload repos or PR create fails.

      - name: Reject duplicate resource
        id: duplicate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: scripts
        run: |
          set -euo pipefail
          python3 scripts/check_duplicate_resource.py --resolved-json /tmp/resolved.json

      - name: Open workload PR
        id: pr
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          chmod +x scripts/open_workload_pr.sh
          scripts/open_workload_pr.sh /tmp/resolved.json /tmp/stack-out "${APP_TOKEN}"
          echo "url=$(cat .pr-url)" >> "${GITHUB_OUTPUT}"

      - name: Create Deployment
        id: deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENVIRONMENT: ${{ steps.validate.outputs.environment }}
          STACK_ID: ${{ steps.validate.outputs.stack_id }}
          PR_URL: ${{ steps.pr.outputs.url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          payload="$(python3 -c 'import json,os; print(json.dumps({"stack_id":os.environ["STACK_ID"],"pr":os.environ["PR_URL"],"issue":int(os.environ["ISSUE_NUMBER"])}))')"
          resp="$(gh api --method POST "/repos/${{ github.repository }}/deployments" --input - <<EOF
          {
            "ref": "${{ github.sha }}",
            "environment": "${ENVIRONMENT}",
            "description": "IssueOps ${STACK_ID}",
            "auto_merge": false,
            "required_contexts": [],
            "payload": ${payload}
          }
          EOF
          )"
          dep_id="$(printf '%s' "${resp}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"
          echo "id=${dep_id}" >> "${GITHUB_OUTPUT}"
          status_args=(
            --method POST
            "/repos/${{ github.repository }}/deployments/${dep_id}/statuses"
            -f state="pending"
            -f description="Workload PR opened"
          )
          if [[ "${PR_URL}" == https://* ]]; then
            status_args+=(-f environment_url="${PR_URL}" -f log_url="${PR_URL}")
          fi
          gh api "${status_args[@]}"

      - name: Update issue
        id: update-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
          STACK_ID: ${{ steps.validate.outputs.stack_id }}
          WORKLOAD: ${{ steps.validate.outputs.workload }}
          DEP_ID: ${{ steps.deploy.outputs.id }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "status:pending-validation" \
            --remove-label "status:validation-failed" \
            --remove-label "status:config-error" \
            --remove-label "status:provision-failed" \
            --add-label "status:pr-open"
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ### IssueOps accepted

          | Field | Value |
          | --- | --- |
          | Stack | \`${STACK_ID}\` |
          | Workload | \`${WORKLOAD}\` |
          | Pull request | ${PR_URL} |
          | Deployment id | \`${DEP_ID}\` |

          Next: review the PR; workload CI runs \`tofu-pipeline\` plan. Merge + Environment approval applies.
          EOF
          )"

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CFG: ${{ steps.cfg.outcome }}
          PARSE: ${{ steps.parse.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          RENDER: ${{ steps.render.outcome }}
          APP: ${{ steps.app-token.outcome }}
          DUP: ${{ steps.duplicate.outcome }}
          PR: ${{ steps.pr.outcome }}
          DEPLOY: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          label="status:provision-failed"
          reason="provision"
          if [[ "${CFG}" == "failure" || "${APP}" == "failure" ]]; then
            label="status:config-error"
            reason="config (pins/App credentials/token)"
          elif [[ "${PARSE}" == "failure" || "${VALIDATE}" == "failure" || "${RENDER}" == "failure" || "${DUP}" == "failure" ]]; then
            label="status:validation-failed"
            reason="validation (form/catalog/render/duplicate)"
          elif [[ "${PR}" == "failure" || "${DEPLOY}" == "failure" ]]; then
            label="status:provision-failed"
            reason="provision (PR/deployment)"
          fi

          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "status:pending-validation" \
            --remove-label "status:validation-failed" \
            --remove-label "status:config-error" \
            --remove-label "status:provision-failed" \
            --add-label "${label}" || true
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ### IssueOps failed (\`${reason}\`)

          Label: \`${label}\`
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )" || true
