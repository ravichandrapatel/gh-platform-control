name: apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: sandbox or prod
        required: true
        type: choice
        options: [sandbox, prod]
      module_path:
        required: true
        default: examples/s3-bucket
        type: string
      confirm_apply:
        description: Type APPLY to confirm
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Confirm APPLY
        env:
          CONFIRM_APPLY: ${{ inputs.confirm_apply }}
        run: |
          set -euo pipefail
          [[ "${CONFIRM_APPLY}" == "APPLY" ]] || { echo "::error::confirm_apply must be APPLY"; exit 1; }

      - name: Validate pins (strict)
        run: |
          set -euo pipefail
          ./scripts/validate-pins.sh

      - name: Read pins
        id: pins
        run: |
          set -euo pipefail
          actions_repo=$(awk '/^actions:/{f=1} f&&/repository:/{print $2; exit}' config/pins.yaml)
          actions_ref=$(awk '/^actions:/{f=1} f&&/ref:/{print $2; exit}' config/pins.yaml)
          modules_repo=$(awk '/^modules:/{f=1} f&&/repository:/{print $2; exit}' config/pins.yaml)
          modules_ref=$(awk '/^modules:/{f=1} f&&/ref:/{print $2; exit}' config/pins.yaml)
          echo "actions_repo=${actions_repo}" >> "${GITHUB_OUTPUT}"
          echo "actions_ref=${actions_ref}" >> "${GITHUB_OUTPUT}"
          echo "modules_repo=${modules_repo}" >> "${GITHUB_OUTPUT}"
          echo "modules_ref=${modules_ref}" >> "${GITHUB_OUTPUT}"

      - name: Checkout actions (pinned)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.pins.outputs.actions_repo }}
          ref: ${{ steps.pins.outputs.actions_ref }}
          path: .gh-platform-actions

      - name: Load environment role
        id: envcfg
        env:
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          file="config/environments/${ENV_NAME}.yaml"
          role=$(awk '/aws_role_arn:/{print $2; exit}' "${file}")
          region=$(awk '/aws_region:/{print $2; exit}' "${file}")
          echo "role=${role}" >> "${GITHUB_OUTPUT}"
          echo "region=${region}" >> "${GITHUB_OUTPUT}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 # v4.1.0
        with:
          role-to-assume: ${{ steps.envcfg.outputs.role }}
          aws-region: ${{ steps.envcfg.outputs.region }}

      - name: OpenTofu apply via Commons
        uses: ./.gh-platform-actions/actions/iac/commons
        with:
          modules_repository: ${{ steps.pins.outputs.modules_repo }}
          modules_ref: ${{ steps.pins.outputs.modules_ref }}
          module_path: ${{ inputs.module_path }}
          command: apply
          confirm_apply: APPLY
          aws_region: ${{ steps.envcfg.outputs.region }}
