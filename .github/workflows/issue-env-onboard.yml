# FILE_NAME: issue-env-onboard.yml
# DESCRIPTION: EnvOps — create infra-<env>, ruleset/vars/secret, control registry PR.
# VERSION: 0.1.1

name: issue-env-onboard

on:
  issues:
    types: [opened, edited, reopened, labeled]

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  PYTHONPATH: src

concurrency:
  group: issue-env-onboard-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  onboard:
    if: contains(github.event.issue.labels.*.name, 'envops')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Authorize requester
        id: authz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.event.issue.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -m gh_platform_control authorize \
            --root . \
            --actor "${ACTOR}" \
            --repository "${REPOSITORY}" \
            --mode operators_or_write

      - name: Validate control config
        id: cfg
        run: |
          set -euo pipefail
          ALLOW_PIN_PLACEHOLDERS=1 python3 -m gh_platform_control validate-pins
          ALLOW_PLACEHOLDERS=1 python3 -m gh_platform_control validate-control

      - name: Parse issue body
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          printf '%s\n' "${ISSUE_BODY}" > /tmp/issue-body.md
          python3 -m gh_platform_control parse-issue --body-file /tmp/issue-body.md --out /tmp/env-request.json
          slug="$(python3 -c 'import json; print(json.load(open("/tmp/env-request.json")).get("environment_name","").strip())')"
          if [[ -z "${slug}" ]]; then
            echo "::error::missing Environment name in issue form body"
            exit 1
          fi
          if [[ ! "${slug}" =~ ^[a-z][a-z0-9-]{1,30}$ ]]; then
            echo "::error::invalid Environment name (expected lowercase slug)"
            exit 1
          fi
          echo "slug=${slug}" >> "${GITHUB_OUTPUT}"

      - name: Validate env request
        id: validate
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CONTROL_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -m gh_platform_control validate-env \
            --request-json /tmp/env-request.json \
            --root . \
            --issue-number "${ISSUE_NUMBER}" \
            --control-repo "${CONTROL_REPO}" \
            --out /tmp/env-resolved.json
          echo "workload=$(python3 -c 'import json; print(json.load(open("/tmp/env-resolved.json"))["workload_repository"])')" >> "${GITHUB_OUTPUT}"
          echo "environment=$(python3 -c 'import json; print(json.load(open("/tmp/env-resolved.json"))["environment"])')" >> "${GITHUB_OUTPUT}"

      - name: Scaffold workload tree
        id: scaffold
        run: |
          set -euo pipefail
          python3 -m gh_platform_control scaffold-infra \
            --resolved-json /tmp/env-resolved.json \
            --out-dir /tmp/infra-scaffold

      - name: Require App credentials
        id: require-creds
        env:
          CLIENT_ID: ${{ vars.CONTROL_CLIENT_ID }}
          PRIVATE_KEY_PRESENT: ${{ secrets.CONTROL_APP_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          if [[ -z "${CLIENT_ID}" ]]; then
            echo "::error::CONTROL_CLIENT_ID repository variable is missing on control."
            exit 1
          fi
          if [[ "${PRIVATE_KEY_PRESENT}" != "true" ]]; then
            echo "::error::CONTROL_APP_PRIVATE_KEY repository secret is missing on control."
            exit 1
          fi
          echo "OK: App credentials present"

      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.CONTROL_CLIENT_ID }}
          private-key: ${{ secrets.CONTROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Omit repositories: need org/user installation scope to create repos
          # and to open the control registry PR. Prefer App install on All repos
          # (must include gh-platform-modules for workload module mint).

      - name: Onboard workload repository
        id: onboard
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          CONTROL_CLIENT_ID: ${{ vars.CONTROL_CLIENT_ID }}
          CONTROL_APP_PRIVATE_KEY: ${{ secrets.CONTROL_APP_PRIVATE_KEY }}
          CONTROL_USER_REPO_TOKEN: ${{ secrets.CONTROL_USER_REPO_TOKEN }}
          MODULES_GIT_TOKEN: ${{ secrets.MODULES_GIT_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            --resolved-json /tmp/env-resolved.json
            --scaffold-dir /tmp/infra-scaffold
            --token "${APP_TOKEN}"
            --app-client-id "${CONTROL_CLIENT_ID}"
            --app-private-key "${CONTROL_APP_PRIVATE_KEY}"
            --ruleset-json docs/ruleset-workload.json
          )
          if [[ -n "${MODULES_GIT_TOKEN:-}" ]]; then
            args+=(--modules-token "${MODULES_GIT_TOKEN}")
          fi
          if [[ -n "${CONTROL_USER_REPO_TOKEN:-}" ]]; then
            args+=(--user-repo-token "${CONTROL_USER_REPO_TOKEN}")
          fi
          python3 -m gh_platform_control onboard-environment "${args[@]}"
          echo "url=$(cat .workload-url)" >> "${GITHUB_OUTPUT}"

      - name: Open control registry PR
        id: registry
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          python3 -m gh_platform_control open-env-registry-pr \
            --resolved-json /tmp/env-resolved.json \
            --token "${APP_TOKEN}"
          echo "url=$(cat .env-registry-pr-url)" >> "${GITHUB_OUTPUT}"

      - name: Update issue
        id: update-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKLOAD: ${{ steps.validate.outputs.workload }}
          WORKLOAD_URL: ${{ steps.onboard.outputs.url }}
          REGISTRY_PR: ${{ steps.registry.outputs.url }}
          ENV_NAME: ${{ steps.validate.outputs.environment }}
        run: |
          set -euo pipefail
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "status:pending-validation" \
            --remove-label "status:validation-failed" \
            --remove-label "status:config-error" \
            --remove-label "status:provision-failed" \
            --add-label "status:env-ready"
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ### EnvOps accepted

          | Field | Value |
          | --- | --- |
          | Environment | \`${ENV_NAME}\` |
          | Workload | [${WORKLOAD}](${WORKLOAD_URL}) |
          | Registry PR | ${REGISTRY_PR} |

          #### Done by automation
          - Private repo + starter from \`examples/infra-*\`
          - GitHub Environment \`${ENV_NAME}\` + repo/env variables
          - App mint vars/secret: \`CONTROL_CLIENT_ID\`, \`MODULES_GIT_REPOSITORY\`, \`CONTROL_APP_PRIVATE_KEY\`
          - Ruleset \`protect-main\` (\`guard-new-stacks\`, **no admin bypass**)

          #### Still manual (AWS)
          1. Create/update IAM OIDC trust: \`repo:${WORKLOAD}:environment:${ENV_NAME}\` → role in the form.
          2. Ensure remote state bucket / backend for this account.
          3. Merge the **registry PR** so stack Issue Form lists \`${ENV_NAME}\`.
          4. Prod: add Environment **reviewers** on the workload repo if required.
          EOF
          )"

      - name: Mark failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUTHZ: ${{ steps.authz.outcome }}
          CFG: ${{ steps.cfg.outcome }}
          PARSE: ${{ steps.parse.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          SCAFFOLD: ${{ steps.scaffold.outcome }}
          CREDS: ${{ steps.require-creds.outcome }}
          APP: ${{ steps.app-token.outcome }}
          ONBOARD: ${{ steps.onboard.outcome }}
          REGISTRY: ${{ steps.registry.outcome }}
        run: |
          set -euo pipefail
          label="status:provision-failed"
          reason="onboard"
          if [[ "${AUTHZ}" == "failure" ]]; then
            label="status:validation-failed"
            reason="authorization"
          elif [[ "${CFG}" == "failure" || "${CREDS}" == "failure" || "${APP}" == "failure" ]]; then
            label="status:config-error"
            reason="config (pins/App credentials)"
          elif [[ "${PARSE}" == "failure" || "${VALIDATE}" == "failure" || "${SCAFFOLD}" == "failure" ]]; then
            label="status:validation-failed"
            reason="validation (form/registry/scaffold)"
          elif [[ "${ONBOARD}" == "failure" || "${REGISTRY}" == "failure" ]]; then
            label="status:provision-failed"
            reason="provision (repo/ruleset/registry PR)"
          fi

          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --remove-label "status:pending-validation" \
            --remove-label "status:validation-failed" \
            --remove-label "status:config-error" \
            --remove-label "status:provision-failed" \
            --remove-label "status:env-ready" \
            --add-label "${label}" || true

          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "$(cat <<EOF
          ### EnvOps failed (\`${reason}\`)

          Label: \`${label}\`
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )" || true
