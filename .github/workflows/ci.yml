name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pins-and-layout:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate pin shape
        run: |
          set -euo pipefail
          ALLOW_PIN_PLACEHOLDERS=1 ./scripts/validate-pins.sh
      - name: Reject floating words in pins
        run: |
          set -euo pipefail
          if grep -E 'ref:[[:space:]]*(main|master|latest|HEAD)[[:space:]]*$' config/pins.yaml; then
            echo "::error::floating ref in pins.yaml"
            exit 1
          fi
