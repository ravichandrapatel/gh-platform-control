# FILE_NAME: ci.yml
# DESCRIPTION: Validate pins, environments registry, catalog, and templates.
# VERSION: 0.4.0

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: src

jobs:
  control-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate pins
        run: |
          set -euo pipefail
          ALLOW_PIN_PLACEHOLDERS=1 python3 -m gh_platform_control validate-pins

      - name: Validate control registry
        run: |
          set -euo pipefail
          ALLOW_PLACEHOLDERS=1 python3 -m gh_platform_control validate-control

      - name: Smoke parse + validate + render
        run: |
          set -euo pipefail
          cat > /tmp/issue-body.md <<'EOF'
          ### Product

          s3-bucket

          ### Environment

          dev

          ### Bucket name

          example-bucket-unique-12345

          ### Project

          ExampleApp

          ### Enable versioning

          true
          EOF
          python3 -m gh_platform_control parse-issue --body-file /tmp/issue-body.md --out /tmp/request.json
          python3 - <<'PY'
          import json
          req = json.load(open("/tmp/request.json"))
          assert req.get("product") == "s3-bucket", req
          print("parse product ok")
          PY
          python3 -m gh_platform_control validate-request \
            --request-json /tmp/request.json \
            --product "$(python3 -c 'import json; print(json.load(open("/tmp/request.json"))["product"])')" \
            --root . \
            --issue-number 1 \
            --control-repo OWNER/gh-platform-control \
            --out /tmp/resolved.json
          python3 -m gh_platform_control render-stack \
            --resolved-json /tmp/resolved.json \
            --root . \
            --out-dir /tmp/stack-out
          test -f /tmp/stack-out/main.tf
          test -f /tmp/stack-out/stack-metadata.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/resolved.json"))
          assert r["stack_id"] == "s3-bucket-example-bucket-unique-12345", r["stack_id"]
          assert r["natural_key"] == "s3-bucket:dev:example-bucket-unique-12345", r["natural_key"]
          assert r.get("runner") == "tofu", r.get("runner")
          assert "issue-" not in r["stack_id"]
          print("natural-key ok", r["stack_id"], r["natural_key"])
          PY

          # Terragrunt thin-wrapper product (same form fields, different Product)
          python3 - <<'PY'
          import json
          req = json.load(open("/tmp/request.json"))
          req["product"] = "s3-bucket-tg"
          json.dump(req, open("/tmp/request-tg.json", "w"), indent=2)
          PY
          python3 -m gh_platform_control validate-request \
            --request-json /tmp/request-tg.json \
            --product s3-bucket-tg \
            --root . \
            --issue-number 1 \
            --control-repo OWNER/gh-platform-control \
            --out /tmp/resolved-tg.json
          python3 -m gh_platform_control render-stack \
            --resolved-json /tmp/resolved-tg.json \
            --root . \
            --out-dir /tmp/stack-out-tg
          test -f /tmp/stack-out-tg/terragrunt.hcl
          test -f /tmp/stack-out-tg/stack-metadata.json
          python3 - <<'PY'
          import json
          r = json.load(open("/tmp/resolved-tg.json"))
          assert r["runner"] == "terragrunt", r.get("runner")
          assert r["stack_id"] == "s3-bucket-tg-example-bucket-unique-12345", r["stack_id"]
          meta = json.load(open("/tmp/stack-out-tg/stack-metadata.json"))
          assert meta.get("bucket_name") == "example-bucket-unique-12345", meta
          assert meta.get("runner") == "terragrunt", meta
          print("terragrunt product ok", r["stack_id"], r["runner"])
          PY

          # Reject path-traversal / unsafe product ids
          python3 - <<'PY'
          import json
          req = json.load(open("/tmp/request.json"))
          req["product"] = "../etc/passwd"
          json.dump(req, open("/tmp/request-trav.json", "w"), indent=2)
          PY
          if python3 -m gh_platform_control validate-request \
            --request-json /tmp/request-trav.json \
            --product '../etc/passwd' \
            --root . \
            --issue-number 1 \
            --control-repo OWNER/gh-platform-control \
            --out /tmp/should-fail.json 2>/tmp/trav.err; then
            echo "::error::expected path-traversal product id to fail"
            exit 1
          fi
          grep -qi 'invalid product' /tmp/trav.err
          echo "path-traversal rejection ok"
