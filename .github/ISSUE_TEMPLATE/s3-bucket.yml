name: Provision S3 bucket
description: Request an S3 bucket (authorized operators only — public demo is gated).
title: "[provision][s3-bucket] "
# Do NOT auto-apply issueops/product labels — that would let any public user
# trigger provision. Maintainers (or authorized authors with write) add:
#   issueops, product:s3-bucket, status:pending-validation
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Public demo gate:** opening this form does **not** start provisioning.
        An authorized operator must label the issue with `issueops` + `product:s3-bucket`
        (and be listed in `config/operators.yaml` or have write access on this repo).

        Flow after authorization: validate → codegen → GitOps PR on the workload repo.
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Maps to an AWS account + workload repository.
      options:
        - dev
        - prod
    validations:
      required: true
  - type: input
    id: bucket_name
    attributes:
      label: Bucket name
      description: Globally unique S3 bucket name (lowercase).
      placeholder: my-app-assets-dev
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: Project
      description: Tagging project name (PascalCase or alnum).
      placeholder: MyApp
    validations:
      required: true
  - type: dropdown
    id: enable_versioning
    attributes:
      label: Enable versioning
      options:
        - "true"
        - "false"
      default: 0
    validations:
      required: true
