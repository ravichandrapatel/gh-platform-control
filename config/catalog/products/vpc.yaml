# Product catalog entry — VPC golden path (public+private /24s derived from CIDR).
id: vpc
title: VPC
description: Provision a VPC with public and private subnets via golden-path module.
template: vpc
runner: tofu
module:
  path: vpc
  ref: vpc/v1.0.0
inputs:
  environment:
    required: true
    from_environments: true
  project:
    required: true
    pattern: "^[A-Za-z][A-Za-z0-9_-]{1,63}$"
    description: Tagging project name (PascalCase or alnum).
    placeholder: MyApp
  vpc_name:
    required: true
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9-]{1,61}[a-zA-Z0-9]$"
    description: VPC name tag (alnum/hyphen).
    placeholder: app-dev-vpc
  cidr_block:
    required: true
    pattern: "^([0-9]{1,3}[.]){3}[0-9]{1,3}/16$"
    description: VPC CIDR must be /16. Public/private /24 subnets are derived automatically.
    placeholder: 10.20.0.0/16
  create_nat_gateway:
    required: true
    description: Create a single NAT Gateway for private subnets (costs apply).
    enum:
      - "false"
      - "true"
stack_id_from:
  - product
  - vpc_name
uniqueness_key_from:
  - vpc_name
