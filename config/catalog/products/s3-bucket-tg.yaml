# Product catalog entry — S3 via thin Terragrunt wrapper (same module pins).
id: s3-bucket-tg
title: S3 Bucket (Terragrunt)
description: Provision an S3 bucket via Terragrunt thin wrapper around the golden-path module.
template: s3-bucket-tg
runner: terragrunt
module:
  path: s3
  ref: s3/v1.0.0
inputs:
  environment:
    required: true
    from_environments: true
  bucket_name:
    required: true
    pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    description: Globally unique S3 bucket name (lowercase).
    placeholder: my-app-assets-dev
  project:
    required: true
    pattern: "^[A-Za-z][A-Za-z0-9_-]{1,63}$"
    description: Tagging project name (PascalCase or alnum).
    placeholder: MyApp
  enable_versioning:
    required: true
    description: Enable S3 bucket versioning.
    enum:
      - "true"
      - "false"
# Deterministic GitOps path/branch (no issue suffix).
stack_id_from:
  - product
  - bucket_name
# Uniqueness within an environment (workload repo). Git is source of truth.
# Bucket name is unique per env across tofu + terragrunt products (duplicate scan).
uniqueness_key_from:
  - bucket_name
