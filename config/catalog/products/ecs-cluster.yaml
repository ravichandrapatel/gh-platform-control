# Product catalog entry — ECS cluster (Fargate-capable empty cluster).
id: ecs-cluster
title: ECS Cluster
description: Provision an ECS cluster via golden-path module.
template: ecs-cluster
runner: tofu
module:
  path: ecs-cluster
  ref: ecs-cluster/v1.0.0
inputs:
  environment:
    required: true
    from_environments: true
  project:
    required: true
    pattern: "^[A-Za-z][A-Za-z0-9_-]{1,63}$"
    description: Tagging project name (PascalCase or alnum).
    placeholder: MyApp
  cluster_name:
    required: true
    pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]{1,254}$"
    description: ECS cluster name.
    placeholder: app-dev
  enable_container_insights:
    required: true
    description: Enable CloudWatch Container Insights (extra cost).
    enum:
      - "false"
      - "true"
stack_id_from:
  - product
  - cluster_name
uniqueness_key_from:
  - cluster_name
