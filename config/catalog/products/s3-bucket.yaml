# Product catalog entry — allowlisted inputs for Issue Form "Provision S3 bucket".
id: s3-bucket
title: S3 Bucket
description: Provision an S3 bucket via golden-path module.
template: s3-bucket
issue_form: s3-bucket.yml
module:
  path: s3
  ref: s3/v1.0.0
inputs:
  environment:
    required: true
    from_environments: true
  bucket_name:
    required: true
    pattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  project:
    required: true
    pattern: "^[A-Za-z][A-Za-z0-9_-]{1,63}$"
  enable_versioning:
    required: true
    enum: ["true", "false"]
# Deterministic GitOps path/branch (no issue suffix).
stack_id_from:
  - product
  - bucket_name
# Uniqueness within an environment (workload repo). Git is source of truth.
uniqueness_key_from:
  - bucket_name
