# Product catalog entry — Secrets Manager secret (placeholder version; no secret values in Issues).
id: secrets-manager
title: Secrets Manager
description: Provision a Secrets Manager secret shell (populate values outside IssueOps).
template: secrets-manager
runner: tofu
module:
  path: secrets-manager
  ref: secrets-manager/v1.0.0
inputs:
  environment:
    required: true
    from_environments: true
  project:
    required: true
    pattern: "^[A-Za-z][A-Za-z0-9_-]{1,63}$"
    description: Tagging project name (PascalCase or alnum).
    placeholder: MyApp
  secret_name:
    required: true
    pattern: "^[a-zA-Z0-9/_+=.@-]{1,512}$"
    description: Secret name/path (no secret values in the Issue Form).
    placeholder: app/dev/db
  secret_description:
    required: false
    # Printable ASCII (space through tilde); avoid \\x escapes — simple YAML loader is literal.
    pattern: "^[ -~]{0,256}$"
    description: Optional human description (ASCII).
    placeholder: Application database credentials
stack_id_from:
  - product
  - secret_name
uniqueness_key_from:
  - secret_name
