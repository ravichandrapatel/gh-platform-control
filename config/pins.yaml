# Immutable pins only. Floating refs (main/master/latest/HEAD) are rejected.
# Replace OWNER after remotes exist.

actions:
  repository: OWNER/gh-platform-actions
  # 40-char commit SHA of tofu-pipeline release.
  ref: REPLACE_WITH_ACTIONS_COMMIT_SHA

modules:
  repository: OWNER/gh-platform-modules
  # Default tagging module pin used by generated stacks (product catalog overrides path modules).
  tagging_ref: tagging/v0.0.0

aws:
  region: us-east-1
