# FILE_NAME: tofu.yml
# DESCRIPTION: infra-prod workload CI — plan on PR, apply on main via tofu-pipeline.
# VERSION: 0.3.0

name: tofu

on:
  pull_request:
    paths:
      - "stacks/**"
      - ".github/workflows/tofu.yml"
  push:
    branches: [main]
    paths:
      - "stacks/**"

permissions:
  contents: read
  id-token: write

jobs:
  # Job id is a required status check on workload main (ruleset-workload.json).
  guard-new-stacks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ravichandrapatel/gh-platform-actions/actions/security/guard-new-stacks@0ed7dfe8e8fbcfd1cac2d783abcb6944ca821118
        with:
          base_ref: origin/${{ github.base_ref }}
          head_ref_name: ${{ github.head_ref }}
          actor: ${{ github.actor }}

  detect:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: dirs
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            mapfile -t changed < <(git diff --name-only origin/${{ github.base_ref }}...HEAD -- 'stacks/**' | awk -F/ 'NF>=2{print $1"/"$2}' | sort -u)
          else
            mapfile -t changed < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'stacks/**' | awk -F/ 'NF>=2{print $1"/"$2}' | sort -u || true)
          fi
          if [[ ${#changed[@]} -eq 0 ]]; then
            echo 'dirs=[]' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          json=$(printf '%s\n' "${changed[@]}" | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "dirs=${json}" >> "${GITHUB_OUTPUT}"

  plan:
    needs: [guard-new-stacks, detect]
    if: github.event_name == 'pull_request' && needs.detect.outputs.dirs != '[]'
    strategy:
      fail-fast: false
      matrix:
        working_directory: ${{ fromJSON(needs.detect.outputs.dirs) }}
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: ravichandrapatel/gh-platform-actions/.github/workflows/tofu-pipeline.yml@0ed7dfe8e8fbcfd1cac2d783abcb6944ca821118
    with:
      working_directory: ${{ matrix.working_directory }}
      environment: prod
      aws_role_arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/gh-platform-prod
      aws_region: us-east-1
      command: plan
      control_app_client_id: ${{ vars.CONTROL_CLIENT_ID }}
      modules_git_repository: ${{ vars.MODULES_GIT_REPOSITORY }}
    secrets:
      control_app_private_key: ${{ secrets.CONTROL_APP_PRIVATE_KEY }}

  apply:
    needs: detect
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect.outputs.dirs != '[]'
    strategy:
      fail-fast: false
      matrix:
        working_directory: ${{ fromJSON(needs.detect.outputs.dirs) }}
    permissions:
      contents: read
      id-token: write
      actions: write
    uses: ravichandrapatel/gh-platform-actions/.github/workflows/tofu-pipeline.yml@0ed7dfe8e8fbcfd1cac2d783abcb6944ca821118
    with:
      working_directory: ${{ matrix.working_directory }}
      environment: prod
      aws_role_arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/gh-platform-prod
      aws_region: us-east-1
      command: apply
      confirm_apply: APPLY
      control_app_client_id: ${{ vars.CONTROL_CLIENT_ID }}
      modules_git_repository: ${{ vars.MODULES_GIT_REPOSITORY }}
    secrets:
      control_app_private_key: ${{ secrets.CONTROL_APP_PRIVATE_KEY }}
