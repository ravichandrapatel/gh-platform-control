# FILE_NAME: drift.yml
# DESCRIPTION: infra-prod drift detect — report only (H2/prod); no stamp PR.
# VERSION: 0.1.0

name: drift

on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  drift:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Pin to the same SHA as tofu.yml / control config/pins.yaml after publishing drift-reconcile.
    uses: ravichandrapatel/gh-platform-actions/.github/workflows/drift-reconcile.yml@952412b3bffed728a9e07cd42cca705eda0a621f
    with:
      aws_role_arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/gh-platform-prod
      aws_region: us-east-1
      open_reconcile_pr: false
      control_app_client_id: ${{ vars.CONTROL_CLIENT_ID }}
      modules_git_repository: ${{ vars.MODULES_GIT_REPOSITORY }}
    secrets:
      control_app_private_key: ${{ secrets.CONTROL_APP_PRIVATE_KEY }}
