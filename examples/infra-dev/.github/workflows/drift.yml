# FILE_NAME: drift.yml
# DESCRIPTION: infra-dev drift detect — report + stamp PR for create/update-only (H2/dev).
# VERSION: 0.1.0

name: drift

on:
  schedule:
    # Weekdays 06:00 UTC — adjust for your team
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  drift:
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    # Pin to the same SHA as tofu.yml / control config/pins.yaml after publishing drift-reconcile.
    uses: ravichandrapatel/gh-platform-actions/.github/workflows/drift-reconcile.yml@abb8ce241fb130b69ba9512bc5c9f722eb3795a0
    with:
      aws_role_arn: arn:aws:iam::REPLACE_ACCOUNT_ID:role/gh-platform-dev
      aws_region: us-east-1
      open_reconcile_pr: true
    secrets:
      modules_git_token: ${{ secrets.MODULES_GIT_TOKEN }}
